<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- favicon.svg drawn on the 96px landing grid: every edge sits on an even unit, so it lands on whole pixels at 100%, 150% and 200% display scaling -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15190f"/>
      <stop offset="1" stop-color="#0a0c08"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1fae54"/>
      <stop offset="1" stop-color="#2ee06b"/>
    </linearGradient>
  </defs>

  <!-- border as two filled shapes instead of a stroke, so both edges sit on the grid -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="#332e1c"/>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#tile)"/>

  <polyline points="16,66 30,56 40,62 52,48 64,54 80,26"
            fill="none" stroke="url(#line)" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
